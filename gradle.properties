# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Run independent modules/tasks in parallel.
org.gradle.parallel=true
# Use the AndroidX libraries (not the old Support Library).
android.useAndroidX=true
# Kotlin official code style.
kotlin.code.style=official
# Keep each module's R (resource) class non-transitive = smaller, faster builds.
android.nonTransitiveRClass=true
